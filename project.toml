[project]
name = "httprexx"
version = "1.0.0-dev"
# CGI handler load module (REXX Server Pages). The rexx370 IRX services are
# resolved at runtime against the modules already installed on the system
# (IRXINIT/IRXEXEC/IRXTERM), so rexx370 is NOT a build dependency — only its
# headers are vendored under include/ (see doc/rexx370-bindings.md).
type = "application"

[build]
# gnu99 for the CGI glue (mixed decls, // comments, snprintf, stdbool).
# -I include picks up httprexx's own headers and the vendored IRX headers.
cflags = ["-std=gnu99", "-I", "include"]

# ── Load module: the REXX CGI handler ───────────────────────────────
# The CGI entry calls main(); httpd/httpc come from the GRT (grtapp1/grtapp2).
[[module]]
name = "HTTPREXX"
rent = true
reus = true
# @@START comes from httpd's CGI launcher in httpd.a (mvslovers/mbt#62)
dep_startup = true
sources = ["src/*.c", "asm/*.asm"]

# ── Tests (host-runnable: make test-host) ───────────────────────────
# The .rxp transpiler is pure C; its unit test cross-compiles and runs
# natively for a fast inner loop, and as an MVS load module under make test.
[[test]]
name = "TSTRXP"
sources = ["test/tstrxp.c", "src/rxptrans.c"]

[dependencies]
"mvslovers/httpd" = ">=4.2.0-dev"
"mvslovers/ufsd" = ">=1.4.0-dev"


[toolchain]
# Pins the refs release.yml builds the published artifacts against; build.yml
# deliberately keeps floating on main so a cc370/libc370 regression surfaces
# in a PR build (mbt#68).
cc370 = "1.4.0"
libc370 = "2.6.0"
[release]
version_files = ["VERSION"]
